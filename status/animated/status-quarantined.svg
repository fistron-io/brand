<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" color="#24305e"><style>.st-spin{animation:st-spin 1s linear infinite} @keyframes st-spin{to{transform:rotate(360deg)}} .st-dot{animation:st-dot 1.2s ease-in-out infinite} .st-dot.d2{animation-delay:.2s}.st-dot.d3{animation-delay:.4s} @keyframes st-dot{0%,60%,100%{opacity:.25}30%{opacity:1}} .st-wobble{animation:st-wobble 1.4s ease-in-out infinite} @keyframes st-wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(0)}} .st-flip{animation:st-flip 2.8s steps(1) infinite} .st-stripe{animation:st-stripe 3s linear infinite} @keyframes st-stripe{from{transform:translateX(0)}to{transform:translateX(7px)}} @keyframes st-flip{0%{transform:translateX(0)}50%{transform:translateX(12px)}} @media (prefers-reduced-motion: reduce) { .st-spin, .st-dot, .st-wobble, .st-flip, .st-stripe { animation: none !important; } }</style><clipPath id="qc"><rect x="2" y="2" width="20" height="20" rx="5"/></clipPath><rect x="2" y="2" width="20" height="20" rx="5" fill="#f2c94c"/><g clip-path="url(#qc)"><path class="st-stripe" d="M-35 0 L-11 24 M-28 0 L-4 24 M-21 0 L3 24 M-14 0 L10 24 M-7 0 L17 24 M0 0 L24 24 M7 0 L31 24 M14 0 L38 24 M21 0 L45 24" stroke="#1b2033" stroke-width="2.4" opacity="0.85"/></g></svg>
