<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" color="#24305e"><style>.st-spin{animation:st-spin 1s linear infinite} @keyframes st-spin{to{transform:rotate(360deg)}} .st-dot{animation:st-dot 1.2s ease-in-out infinite} .st-dot.d2{animation-delay:.2s}.st-dot.d3{animation-delay:.4s} @keyframes st-dot{0%,60%,100%{opacity:.25}30%{opacity:1}} .st-wobble{animation:st-wobble 1.4s ease-in-out infinite} @keyframes st-wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(0)}} .st-flip{animation:st-flip 2.8s steps(1) infinite} .st-stripe{animation:st-stripe 3s linear infinite} @keyframes st-stripe{from{transform:translateX(0)}to{transform:translateX(7px)}} @keyframes st-flip{0%{transform:translateX(0)}50%{transform:translateX(12px)}} @media (prefers-reduced-motion: reduce) { .st-spin, .st-dot, .st-wobble, .st-flip, .st-stripe { animation: none !important; } }</style><defs><clipPath id="fh"><rect class="st-flip" x="0" y="0" width="12" height="24"/></clipPath></defs><g class="st-wobble" style="transform-origin:12px 22px"><path d="M5.5 9 L6.5 2.8 L9.5 6.4 L12 1.6 L14.5 6.4 L17.5 2.8 L18.5 9 Z" fill="#3fa66b"/><circle cx="12" cy="13.5" r="9" fill="#3fa66b"/><g clip-path="url(#fh)"><path d="M5.5 9 L6.5 2.8 L9.5 6.4 L12 1.6 L14.5 6.4 L17.5 2.8 L18.5 9 Z" fill="#d64545"/><circle cx="12" cy="13.5" r="9" fill="#d64545"/></g><circle cx="9" cy="12" r="2.6" fill="#fff"/><circle cx="9.6" cy="12" r="1.2" fill="#1b2033"/><circle cx="15.2" cy="12.6" r="1.9" fill="#fff"/><circle cx="15.5" cy="12.6" r="0.9" fill="#1b2033"/><path d="M8 17.2 L10 15.8 L12 17.4 L14 15.8 L16 17.2" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></svg>
